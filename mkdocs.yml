site_name: gpclog
site_description: General Purpose Category Logger - A Python library for managing categorized logs in complex projects.
site_url: https://linnetcodes.github.io/gpclog
repo_url: https://github.com/linnetcodes/gpclog
repo_name: LinnetCodes/gpclog
edit_uri: edit/mkdocs_pre_publish/docs/
copyright: Copyright &copy; 2026 Linnet Codes

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 简体中文
          build: true

nav:
  - Home: index.md
  - API:
    - GPCLoggerConfig: config.md
    - GPCLogger: logger.md
    - Module: gpclog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences