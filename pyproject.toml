[project]
name = "gpclog"
dynamic = ["version"]
description = "General Purpose Category Logger - A Python library for managing categorized logs in complex projects."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Linnet Codes", email = "linnet.codes@gmail.com" },
]
keywords = [
    "logging",
    "loguru",
    "gpconfig",
    "categorized-logging",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]
dependencies = [
    "loguru>=0.7.0",
    "gpconfig>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    # Documentation (MkDocs Material + i18n). pymdown-extensions is pulled in
    # transitively by mkdocs-material and powers the pymdownx.* markdown extensions.
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]

[project.urls]
Homepage = "https://github.com/linnetcodes/gpclog"
Documentation = "https://linnetcodes.github.io/gpclog"
Repository = "https://github.com/linnetcodes/gpclog"
Issues = "https://github.com/linnetcodes/gpclog/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gpclog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gpclog"]
